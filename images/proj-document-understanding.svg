<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
     role="img" aria-label="Document understanding: OCR, table structure recognition and inference optimization">
  <title>Document Understanding Model</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F4FE"/><stop offset="60%" stop-color="#EDEAFC"/><stop offset="100%" stop-color="#E1DCF9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feOffset in="SourceAlpha" dx="0" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#3B3470" flood-opacity=".14" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#pbg)"/>
  <circle cx="110" cy="70"  r="130" fill="#6C63F5" opacity=".06"/>
  <circle cx="1130" cy="630" r="150" fill="#9B7CFB" opacity=".07"/>

  <!-- 화살표 -->
  <g stroke="#6C63F5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M398 338 L432 338"/><path d="M418 326 L432 338 L418 350"/>
    <path d="M778 338 L812 338"/><path d="M798 326 L812 338 L798 350"/>
  </g>

  <!-- ══ A. 문서 이미지 + OCR ══ -->
  <g filter="url(#soft)"><rect x="60" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="92" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Document image</text>
  <text x="92" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">OCR</text>

  <rect x="92" y="200" width="266" height="336" rx="10" fill="#FBFAFF" stroke="#E7E3F8" stroke-width="2"/>
  <!-- 본문 라인 -->
  <g fill="#DBD6F3">
    <rect x="116" y="228" width="140" height="11" rx="5.5"/>
    <rect x="116" y="266" width="218" height="9" rx="4.5"/>
    <rect x="116" y="288" width="196" height="9" rx="4.5"/>
    <rect x="116" y="310" width="210" height="9" rx="4.5"/>
    <rect x="116" y="392" width="200" height="9" rx="4.5"/>
    <rect x="116" y="414" width="164" height="9" rx="4.5"/>
    <rect x="116" y="470" width="188" height="9" rx="4.5"/>
    <rect x="116" y="492" width="120" height="9" rx="4.5"/>
  </g>
  <!-- 인식 박스 -->
  <g fill="none" stroke="#6C63F5" stroke-width="2.4" stroke-dasharray="7 5">
    <rect x="110" y="220" width="154" height="27" rx="5"/>
    <rect x="110" y="258" width="232" height="27" rx="5"/>
    <rect x="110" y="384" width="214" height="27" rx="5"/>
  </g>
  <rect x="110" y="462" width="202" height="27" rx="5" fill="#6C63F5" opacity=".14"/>
  <rect x="110" y="462" width="202" height="27" rx="5" fill="none" stroke="#6C63F5" stroke-width="2.6"/>
  <!-- 신뢰도 태그 -->
  <g transform="translate(268 440)">
    <rect x="0" y="0" width="52" height="21" rx="10.5" fill="#34C3A8"/>
    <text x="26" y="15" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
          font-size="11.5" font-weight="800" fill="#FFFFFF">0.98</text>
  </g>

  <!-- ══ B. 표 구조 인식 ══ -->
  <g filter="url(#soft)"><rect x="440" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="472" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Table structure</text>
  <text x="472" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">TSR · rows × columns</text>

  <rect x="472" y="204" width="266" height="60" rx="8" fill="#6C63F5" opacity=".14"/>
  <rect x="472" y="204" width="266" height="264" rx="8" fill="none" stroke="#CFC8F0" stroke-width="2"/>
  <g stroke="#CFC8F0" stroke-width="2">
    <path d="M472 264 H738 M472 315 H738 M472 366 H738 M472 417 H738"/>
    <path d="M560 204 V468 M648 204 V468"/>
  </g>
  <!-- 셀 내용 -->
  <g fill="#C9C2EE">
    <rect x="490" y="228" width="52" height="9" rx="4.5"/><rect x="578" y="228" width="52" height="9" rx="4.5"/><rect x="666" y="228" width="52" height="9" rx="4.5"/>
    <rect x="490" y="284" width="44" height="8" rx="4"/><rect x="578" y="284" width="56" height="8" rx="4"/><rect x="666" y="284" width="38" height="8" rx="4"/>
    <rect x="490" y="335" width="52" height="8" rx="4"/><rect x="578" y="335" width="40" height="8" rx="4"/><rect x="666" y="335" width="50" height="8" rx="4"/>
    <rect x="490" y="386" width="38" height="8" rx="4"/><rect x="578" y="386" width="54" height="8" rx="4"/><rect x="666" y="386" width="44" height="8" rx="4"/>
    <rect x="490" y="437" width="50" height="8" rx="4"/><rect x="578" y="437" width="36" height="8" rx="4"/><rect x="666" y="437" width="52" height="8" rx="4"/>
  </g>
  <!-- 검출된 행·열 경계 -->
  <g stroke="#6C63F5" stroke-width="2.6" stroke-dasharray="6 5" opacity=".85">
    <path d="M460 315 H750 M460 366 H750"/>
    <path d="M560 194 V478 M648 194 V478"/>
  </g>
  <g fill="#6C63F5">
    <circle cx="560" cy="315" r="5.5"/><circle cx="648" cy="315" r="5.5"/>
    <circle cx="560" cy="366" r="5.5"/><circle cx="648" cy="366" r="5.5"/>
  </g>
  <!-- 셀 좌표 라벨 -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#8C86AD">
    <text x="472" y="500">r3 · c2</text>
    <text x="738" y="500" text-anchor="end">5 × 3 cells</text>
  </g>

  <!-- ══ C. 추론 최적화 ══ -->
  <g filter="url(#soft)"><rect x="820" y="110" width="330" height="456" rx="22" fill="#262233"/></g>
  <text x="852" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Serving</text>
  <text x="852" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#9B93FF" letter-spacing=".6">TensorRT · Triton</text>

  <!-- 지연시간 바 -->
  <text x="852" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8E88B5">PyTorch</text>
  <rect x="852" y="250" width="250" height="26" rx="13" fill="#3B3552"/>
  <text x="852" y="310" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8E88B5">TensorRT</text>
  <rect x="852" y="322" width="112" height="26" rx="13" fill="#34C3A8"/>
  <path d="M984 341 L996 329 L1008 341" fill="none" stroke="#34C3A8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1016" y="341" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#34C3A8">faster</text>

  <!-- Triton 서빙 -->
  <line x1="852" y1="382" x2="1118" y2="382" stroke="#3B3552" stroke-width="2"/>
  <g transform="translate(852 404)">
    <rect x="0" y="0" width="76" height="58" rx="10" fill="#3B3552"/>
    <rect x="95" y="0" width="76" height="58" rx="10" fill="#3B3552"/>
    <rect x="190" y="0" width="76" height="58" rx="10" fill="#3B3552"/>
    <g fill="#6C63F5"><circle cx="38" cy="29" r="11"/><circle cx="133" cy="29" r="11"/><circle cx="228" cy="29" r="11"/></g>
    <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#8E88B5" text-anchor="middle">
      <text x="38" y="80">OCR</text><text x="133" y="80">TSR</text><text x="228" y="80">Adapter</text>
    </g>
  </g>
  <text x="985" y="530" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#6E6890">per-customer adapters</text>
</svg>
