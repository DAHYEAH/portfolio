<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
     role="img" aria-label="RAG pipeline: question, vector search over FAISS, and a grounded answer with citations">
  <title>Retrieval-Augmented Generation Pipeline</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F4FE"/><stop offset="60%" stop-color="#EDEAFC"/><stop offset="100%" stop-color="#E1DCF9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feOffset in="SourceAlpha" dx="0" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#3B3470" flood-opacity=".14" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#pbg)"/>
  <circle cx="110" cy="70"  r="130" fill="#6C63F5" opacity=".06"/>
  <circle cx="1130" cy="630" r="150" fill="#9B7CFB" opacity=".07"/>

  <g stroke="#6C63F5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M398 338 L432 338"/><path d="M418 326 L432 338 L418 350"/>
    <path d="M778 338 L812 338"/><path d="M798 326 L812 338 L798 350"/>
  </g>

  <!-- ══ A. 질문 + 사내 문서 ══ -->
  <g filter="url(#soft)"><rect x="60" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="92" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Question</text>
  <text x="92" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">chunking · embedding</text>

  <!-- 말풍선 -->
  <g>
    <path d="M92 208 h266 a12 12 0 0 1 12 12 v72 a12 12 0 0 1 -12 12 h-232 l-22 22 v-22 h-12 a12 12 0 0 1 -12 -12 v-72 a12 12 0 0 1 12 -12 Z"
          fill="#6C63F5"/>
    <g fill="#FFFFFF" opacity=".92">
      <rect x="114" y="232" width="200" height="10" rx="5"/>
      <rect x="114" y="256" width="164" height="10" rx="5"/>
    </g>
  </g>

  <!-- 사내 문서 → 청크 -->
  <text x="92" y="358" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#8C86AD" letter-spacing=".8">INTERNAL DOCS</text>
  <g>
    <rect x="92" y="374" width="70" height="90" rx="8" fill="#FBFAFF" stroke="#DCD7F4" stroke-width="2"/>
    <rect x="176" y="374" width="70" height="90" rx="8" fill="#FBFAFF" stroke="#DCD7F4" stroke-width="2"/>
    <rect x="260" y="374" width="70" height="90" rx="8" fill="#FBFAFF" stroke="#DCD7F4" stroke-width="2"/>
    <g fill="#DCD7F4">
      <rect x="106" y="392" width="42" height="7" rx="3.5"/><rect x="106" y="408" width="34" height="7" rx="3.5"/><rect x="106" y="424" width="40" height="7" rx="3.5"/>
      <rect x="190" y="392" width="42" height="7" rx="3.5"/><rect x="190" y="408" width="36" height="7" rx="3.5"/><rect x="190" y="424" width="30" height="7" rx="3.5"/>
      <rect x="274" y="392" width="38" height="7" rx="3.5"/><rect x="274" y="408" width="42" height="7" rx="3.5"/><rect x="274" y="424" width="34" height="7" rx="3.5"/>
    </g>
    <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#9B7CFB">
      <text x="106" y="452">chunk 1</text><text x="190" y="452">chunk 2</text><text x="274" y="452">chunk 3</text>
    </g>
  </g>
  <!-- 임베딩 벡터 -->
  <g transform="translate(92 490)">
    <text x="0" y="0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#8C86AD">embed →</text>
    <g fill="#6C63F5" opacity=".55">
      <rect x="66" y="-16" width="9" height="20" rx="4.5"/><rect x="82" y="-22" width="9" height="26" rx="4.5"/>
      <rect x="98" y="-10" width="9" height="14" rx="4.5"/><rect x="114" y="-26" width="9" height="30" rx="4.5"/>
      <rect x="130" y="-14" width="9" height="18" rx="4.5"/><rect x="146" y="-20" width="9" height="24" rx="4.5"/>
      <rect x="162" y="-8"  width="9" height="12" rx="4.5"/><rect x="178" y="-24" width="9" height="28" rx="4.5"/>
      <rect x="194" y="-12" width="9" height="16" rx="4.5"/><rect x="210" y="-18" width="9" height="22" rx="4.5"/>
      <rect x="226" y="-9"  width="9" height="13" rx="4.5"/><rect x="242" y="-21" width="9" height="25" rx="4.5"/>
    </g>
  </g>

  <!-- ══ B. 벡터 검색 (FAISS) ══ -->
  <g filter="url(#soft)"><rect x="440" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="472" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Vector search</text>
  <text x="472" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">FAISS · top-k</text>

  <rect x="472" y="204" width="266" height="266" rx="14" fill="#FBFAFF" stroke="#E7E3F8" stroke-width="2"/>
  <!-- 벡터 공간의 점들 -->
  <g fill="#CFC8F0">
    <circle cx="506" cy="248" r="6"/><circle cx="558" cy="228" r="5"/><circle cx="700" cy="242" r="6"/><circle cx="642" cy="470" r="5"/>
    <circle cx="512" cy="330" r="5"/><circle cx="716" cy="318" r="5"/><circle cx="694" cy="392" r="6"/>
    <circle cx="522" cy="424" r="6"/><circle cx="584" cy="446" r="5"/><circle cx="666" cy="446" r="5"/>
    <circle cx="498" cy="392" r="5"/><circle cx="726" cy="424" r="6"/><circle cx="640" cy="222" r="5"/>
  </g>
  <!-- top-k 반경 -->
  <circle cx="605" cy="336" r="74" fill="#6C63F5" opacity=".08"/>
  <circle cx="605" cy="336" r="74" fill="none" stroke="#6C63F5" stroke-width="2.4" stroke-dasharray="7 6"/>
  <!-- 회수된 청크 -->
  <g>
    <line x1="605" y1="336" x2="562" y2="298" stroke="#6C63F5" stroke-width="2.4"/>
    <line x1="605" y1="336" x2="656" y2="312" stroke="#6C63F5" stroke-width="2.4"/>
    <line x1="605" y1="336" x2="596" y2="396" stroke="#6C63F5" stroke-width="2.4"/>
    <g fill="#6C63F5"><circle cx="562" cy="298" r="9"/><circle cx="656" cy="312" r="9"/><circle cx="596" cy="396" r="9"/></g>
  </g>
  <!-- 질의 벡터 -->
  <circle cx="605" cy="336" r="13" fill="#34C3A8"/>
  <circle cx="605" cy="336" r="13" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="605" y="502" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#8C86AD">query vector · nearest chunks</text>
  <g transform="translate(472 522)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#34C3A8"/>
    <text x="22" y="12" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4A4460">query</text>
    <rect x="96" y="0" width="14" height="14" rx="4" fill="#6C63F5"/>
    <text x="118" y="12" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4A4460">retrieved</text>
  </g>

  <!-- ══ C. 근거 기반 답변 ══ -->
  <g filter="url(#soft)"><rect x="820" y="110" width="330" height="456" rx="22" fill="#262233"/></g>
  <text x="852" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Grounded answer</text>
  <text x="852" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#9B93FF" letter-spacing=".6">prompt + evidence</text>

  <g fill="#4A4468">
    <rect x="852" y="214" width="248" height="11" rx="5.5"/>
    <rect x="852" y="240" width="220" height="11" rx="5.5"/>
    <rect x="852" y="266" width="236" height="11" rx="5.5"/>
    <rect x="852" y="292" width="150" height="11" rx="5.5"/>
  </g>
  <!-- 인용 칩 -->
  <g transform="translate(852 328)">
    <g fill="#6C63F5">
      <rect x="0" y="0" width="34" height="24" rx="8"/><rect x="44" y="0" width="34" height="24" rx="8"/><rect x="88" y="0" width="34" height="24" rx="8"/>
    </g>
    <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      <text x="17" y="17">1</text><text x="61" y="17">2</text><text x="105" y="17">3</text>
    </g>
    <text x="136" y="17" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8E88B5">cited chunks</text>
  </g>

  <line x1="852" y1="392" x2="1118" y2="392" stroke="#3B3552" stroke-width="2"/>

  <!-- 근거 없으면 모른다고 답함 -->
  <g transform="translate(852 416)">
    <rect x="0" y="0" width="266" height="66" rx="12" fill="#332E4A"/>
    <circle cx="30" cy="33" r="14" fill="#34C3A8"/>
    <path d="M23 33 l5 5 l9 -10" fill="none" stroke="#262233" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#E6E3F5">No evidence → no answer</text>
    <text x="56" y="49" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8E88B5">hallucination guard</text>
  </g>
  <text x="985" y="524" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#6E6890">served over FastAPI</text>
</svg>
