<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="2400" height="1400"
     preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    히어로 배경. 챗봇 패널이 중앙을 덮고 그 위에 흰색 반투명 레이어(72~96%)가
    한 겹 더 깔리므로, 중앙은 비우고 좌우 위쪽에만 형태를 둔다.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#F4F3FE"/>
      <stop offset="50%"  stop-color="#EDEBFD"/>
      <stop offset="100%" stop-color="#F8F8FD"/>
    </linearGradient>

    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6C63F5" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#6C63F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#9B7CFB" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#9B7CFB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#63C6F5" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#63C6F5" stop-opacity="0"/>
    </radialGradient>

    <!-- 문서·격자 모티프: 문서 AI 라는 주제를 아주 옅게만 암시한다 -->
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0 L0 0 0 72" fill="none" stroke="#6C63F5" stroke-width="1" opacity=".18"/>
    </pattern>

    <linearGradient id="gridFadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="maskL"><rect x="0" y="0" width="760" height="1400" fill="url(#gridFadeL)"/></mask>
    <mask id="maskR"><rect x="1640" y="0" width="760" height="1400" fill="url(#gridFadeR)"/></mask>
  </defs>

  <rect width="2400" height="1400" fill="url(#ground)"/>

  <!-- 좌우 가장자리에만 격자 -->
  <rect x="0" y="0" width="760" height="1400" fill="url(#grid)" mask="url(#maskL)"/>
  <rect x="1640" y="0" width="760" height="1400" fill="url(#grid)" mask="url(#maskR)"/>

  <!-- 부드러운 광원: 중앙을 피해 배치 -->
  <ellipse cx="240"  cy="180"  rx="820" ry="720" fill="url(#blobA)"/>
  <ellipse cx="2180" cy="300"  rx="760" ry="680" fill="url(#blobB)"/>
  <ellipse cx="1980" cy="1280" rx="700" ry="560" fill="url(#blobC)"/>
  <ellipse cx="360"  cy="1300" rx="640" ry="520" fill="url(#blobB)"/>

  <!-- 문서 카드 모티프 (좌상단) -->
  <g opacity=".30" transform="translate(150 190) rotate(-9)">
    <rect width="230" height="300" rx="14" fill="#6C63F5" opacity=".22"/>
    <rect x="30" y="44"  width="150" height="11" rx="5.5" fill="#6C63F5"/>
    <rect x="30" y="78"  width="170" height="11" rx="5.5" fill="#6C63F5"/>
    <rect x="30" y="112" width="118" height="11" rx="5.5" fill="#6C63F5"/>
    <rect x="30" y="158" width="170" height="72" rx="8" fill="none" stroke="#6C63F5" stroke-width="3"/>
    <path d="M30 194 H200 M115 158 V230" stroke="#6C63F5" stroke-width="3"/>
  </g>

  <!-- 노드 그래프 모티프 (우상단) — 임베딩·검색을 암시 -->
  <g opacity=".32" transform="translate(1950 210)" stroke="#6C63F5" fill="#6C63F5">
    <path d="M60 60 L200 20 M60 60 L190 170 M60 60 L20 200 M200 20 L190 170 M190 170 L20 200"
          stroke-width="3" fill="none"/>
    <circle cx="60"  cy="60"  r="17"/>
    <circle cx="200" cy="20"  r="11"/>
    <circle cx="190" cy="170" r="13"/>
    <circle cx="20"  cy="200" r="9"/>
  </g>
</svg>
