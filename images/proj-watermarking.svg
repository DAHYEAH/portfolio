<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
     role="img" aria-label="Invisible image watermarking: frequency-domain embedding and robustness against image transformations">
  <title>Invisible Image Watermarking</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F4FE"/><stop offset="60%" stop-color="#EDEAFC"/><stop offset="100%" stop-color="#E1DCF9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B7CFB"/><stop offset="55%" stop-color="#C7B4FD"/><stop offset="100%" stop-color="#F0D9C8"/>
    </linearGradient>
    <radialGradient id="spectrum" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="18%"  stop-color="#C6BEF6"/>
      <stop offset="48%"  stop-color="#6C63F5"/>
      <stop offset="100%" stop-color="#241F3F"/>
    </radialGradient>
    <pattern id="wmdots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#FFFFFF" opacity=".5"/>
      <circle cx="12" cy="12" r="1.6" fill="#241F3F" opacity=".28"/>
    </pattern>
    <clipPath id="photoClip"><rect x="92" y="204" width="266" height="196" rx="12"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feOffset in="SourceAlpha" dx="0" dy="10" result="off"/>
      <feGaussianBlur in="off" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#3B3470" flood-opacity=".14" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#pbg)"/>
  <circle cx="110" cy="70"  r="130" fill="#6C63F5" opacity=".06"/>
  <circle cx="1130" cy="630" r="150" fill="#9B7CFB" opacity=".07"/>

  <g stroke="#6C63F5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M398 338 L432 338"/><path d="M418 326 L432 338 L418 350"/>
    <path d="M778 338 L812 338"/><path d="M798 326 L812 338 L798 350"/>
  </g>

  <!-- ══ A. 원본 이미지 ══ -->
  <g filter="url(#soft)"><rect x="60" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="92" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Original image</text>
  <text x="92" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">눈에 보이지 않는 워터마크</text>

  <g clip-path="url(#photoClip)">
    <rect x="92" y="204" width="266" height="196" fill="url(#sky)"/>
    <circle cx="290" cy="256" r="26" fill="#FFF3E2" opacity=".9"/>
    <path d="M92 366 L162 296 L214 348 L262 306 L358 384 L358 400 L92 400 Z" fill="#4E4380"/>
    <path d="M92 400 L92 372 L150 320 L206 366 L252 328 L358 410 L358 400 Z" fill="#37305F"/>
    <rect x="92" y="204" width="266" height="196" fill="url(#wmdots)"/>
  </g>
  <rect x="92" y="204" width="266" height="196" rx="12" fill="none" stroke="#E7E3F8" stroke-width="2"/>

  <!-- 워터마크 비트 -->
  <text x="92" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#8C86AD" letter-spacing=".8">WATERMARK BITS</text>
  <g transform="translate(92 452)">
    <g fill="#DCD7F4">
      <rect x="0" y="0" width="22" height="22" rx="6"/><rect x="28" y="0" width="22" height="22" rx="6"/>
      <rect x="56" y="0" width="22" height="22" rx="6"/><rect x="84" y="0" width="22" height="22" rx="6"/>
      <rect x="112" y="0" width="22" height="22" rx="6"/><rect x="140" y="0" width="22" height="22" rx="6"/>
      <rect x="168" y="0" width="22" height="22" rx="6"/><rect x="196" y="0" width="22" height="22" rx="6"/>
      <rect x="224" y="0" width="22" height="22" rx="6"/><rect x="252" y="0" width="14" height="22" rx="6"/>
    </g>
    <g fill="#6C63F5">
      <rect x="28" y="0" width="22" height="22" rx="6"/><rect x="84" y="0" width="22" height="22" rx="6"/>
      <rect x="112" y="0" width="22" height="22" rx="6"/><rect x="196" y="0" width="22" height="22" rx="6"/>
      <rect x="224" y="0" width="22" height="22" rx="6"/>
    </g>
  </g>
  <!-- 화질 지표 -->
  <g transform="translate(92 500)">
    <rect x="0" y="0" width="266" height="42" rx="10" fill="#F1EFFD"/>
    <circle cx="26" cy="21" r="12" fill="#34C3A8"/>
    <path d="M20 21 l4.5 4.5 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="26" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#4A4460">육안으로 구분 불가 · 화질 유지</text>
  </g>

  <!-- ══ B. 주파수 도메인 ══ -->
  <g filter="url(#soft)"><rect x="440" y="110" width="330" height="456" rx="22" fill="#FFFFFF"/></g>
  <text x="472" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#262233">Frequency domain</text>
  <text x="472" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6C63F5" letter-spacing=".6">픽셀이 아닌 주파수에 삽입</text>

  <circle cx="605" cy="344" r="126" fill="url(#spectrum)"/>
  <!-- 주파수 링 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".28">
    <circle cx="605" cy="344" r="42"/><circle cx="605" cy="344" r="84"/><circle cx="605" cy="344" r="126"/>
  </g>
  <!-- 워터마크가 실리는 중간 주파수 대역 -->
  <circle cx="605" cy="344" r="63" fill="none" stroke="#34C3A8" stroke-width="16" opacity=".30"/>
  <circle cx="605" cy="344" r="63" fill="none" stroke="#34C3A8" stroke-width="2.6" stroke-dasharray="8 7"/>
  <g fill="#34C3A8">
    <circle cx="605" cy="281" r="6"/><circle cx="650" cy="299" r="6"/><circle cx="668" cy="344" r="6"/>
    <circle cx="650" cy="389" r="6"/><circle cx="605" cy="407" r="6"/><circle cx="560" cy="389" r="6"/>
    <circle cx="542" cy="344" r="6"/><circle cx="560" cy="299" r="6"/>
  </g>
  <!-- 라벨 -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="605" y="349" text-anchor="middle" font-size="11.5" fill="#5B52E0">low</text>
    <text x="605" y="497" text-anchor="middle" font-size="11.5" fill="#8C86AD">high frequency →</text>
  </g>
  <g transform="translate(472 516)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#34C3A8"/>
    <text x="22" y="12" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#4A4460">watermark band (mid)</text>
  </g>

  <!-- ══ C. 강건성 검증 ══ -->
  <g filter="url(#soft)"><rect x="820" y="110" width="330" height="456" rx="22" fill="#262233"/></g>
  <text x="852" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Robustness</text>
  <text x="852" y="181" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#9B93FF" letter-spacing=".6">변환 공격 후에도 검출</text>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- Resize -->
    <g transform="translate(852 210)">
      <rect x="0" y="0" width="266" height="52" rx="11" fill="#332E4A"/>
      <g transform="translate(16 13)" stroke="#9B93FF" stroke-width="2.6" fill="none" stroke-linecap="round">
        <rect x="0" y="0" width="26" height="26" rx="5"/><path d="M8 18 L18 8 M18 8 h-6 M18 8 v6"/>
      </g>
      <text x="58" y="32" font-size="13.5" font-weight="700" fill="#E6E3F5">Resize</text>
      <circle cx="242" cy="26" r="12" fill="#34C3A8"/>
      <path d="M236 26 l4.5 4.5 l8 -9" fill="none" stroke="#262233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- JPEG -->
    <g transform="translate(852 272)">
      <rect x="0" y="0" width="266" height="52" rx="11" fill="#332E4A"/>
      <g transform="translate(16 13)" stroke="#9B93FF" stroke-width="2.6" fill="none" stroke-linecap="round">
        <rect x="0" y="0" width="26" height="26" rx="5"/><path d="M6 13 h14 M6 8 h8 M6 18 h11"/>
      </g>
      <text x="58" y="32" font-size="13.5" font-weight="700" fill="#E6E3F5">JPEG compression</text>
      <circle cx="242" cy="26" r="12" fill="#34C3A8"/>
      <path d="M236 26 l4.5 4.5 l8 -9" fill="none" stroke="#262233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Crop -->
    <g transform="translate(852 334)">
      <rect x="0" y="0" width="266" height="52" rx="11" fill="#332E4A"/>
      <g transform="translate(16 13)" stroke="#9B93FF" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M7 0 V19 a3 3 0 0 0 3 3 H26 M0 7 H19 a3 3 0 0 1 3 3 V26"/>
      </g>
      <text x="58" y="32" font-size="13.5" font-weight="700" fill="#E6E3F5">Crop</text>
      <circle cx="242" cy="26" r="12" fill="#34C3A8"/>
      <path d="M236 26 l4.5 4.5 l8 -9" fill="none" stroke="#262233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Rotate -->
    <g transform="translate(852 396)">
      <rect x="0" y="0" width="266" height="52" rx="11" fill="#332E4A"/>
      <g transform="translate(16 13)" stroke="#9B93FF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 13 a11 11 0 1 1 -4 -8.5"/><path d="M25 0 v6 h-6"/>
      </g>
      <text x="58" y="32" font-size="13.5" font-weight="700" fill="#E6E3F5">Rotate</text>
      <circle cx="242" cy="26" r="12" fill="#34C3A8"/>
      <path d="M236 26 l4.5 4.5 l8 -9" fill="none" stroke="#262233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Noise -->
    <g transform="translate(852 458)">
      <rect x="0" y="0" width="266" height="52" rx="11" fill="#332E4A"/>
      <g transform="translate(16 13)" fill="#9B93FF">
        <circle cx="4" cy="6" r="2.2"/><circle cx="14" cy="3" r="2.2"/><circle cx="23" cy="9" r="2.2"/>
        <circle cx="7" cy="16" r="2.2"/><circle cx="18" cy="19" r="2.2"/><circle cx="25" cy="23" r="2.2"/>
        <circle cx="3" cy="24" r="2.2"/>
      </g>
      <text x="58" y="32" font-size="13.5" font-weight="700" fill="#E6E3F5">Noise</text>
      <circle cx="242" cy="26" r="12" fill="#34C3A8"/>
      <path d="M236 26 l4.5 4.5 l8 -9" fill="none" stroke="#262233" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="985" y="540" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#6E6890">비가시성 ↔ 강건성 트레이드오프</text>
</svg>
